<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTV Live TV</title>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .player {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .error {
            position: absolute;
            color: white;
            background: rgba(0,0,0,.8);
            padding: 15px 20px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="player">

    <video
        id="video"
        controls
        autoplay
        playsinline
        muted>
    </video>

    <div id="error" class="error">
        Không thể phát kênh truyền hình.
    </div>

</div>

<script>

    const video = document.getElementById("video");
    const errorBox = document.getElementById("error");

    const streamUrl =
        "https://live-a.fptplay53.net/live/media/antv/live-hls-avc/antv-avc1_4000000=10000-mp4a_131600=20000.m3u8";


    // ==============================
    // KIỂM TRA HLS
    // ==============================

    if (Hls.isSupported()) {

        const hls = new Hls({
            enableWorker: true,

            // Tự reconnect khi mất mạng
            manifestLoadingMaxRetry: 5,
            levelLoadingMaxRetry: 5,
            fragLoadingMaxRetry: 5,

            // Live stream
            liveSyncDurationCount: 3
        });

        hls.loadSource(streamUrl);

        hls.attachMedia(video);


        // Khi load xong stream
        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            video.play()
                .then(() => {
                    console.log("Đang phát ANTV");
                })
                .catch(error => {

                    console.log(
                        "Trình duyệt chặn autoplay:",
                        error
                    );

                    // Thử phát muted
                    video.muted = true;

                    video.play().catch(() => {
                        errorBox.style.display = "block";
                    });
                });

        });


        // Xử lý lỗi HLS
        hls.on(Hls.Events.ERROR, function (event, data) {

            console.log("HLS Error:", data);

            if (data.fatal) {

                switch (data.type) {

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        console.log(
                            "Lỗi mạng - đang thử kết nối lại..."
                        );

                        hls.startLoad();
                        break;


                    case Hls.ErrorTypes.MEDIA_ERROR:

                        console.log(
                            "Lỗi media - đang recover..."
                        );

                        hls.recoverMediaError();
                        break;


                    default:

                        console.log(
                            "Không thể khôi phục stream."
                        );

                        hls.destroy();

                        errorBox.style.display = "block";

                        break;
                }
            }

        });


    }

    // ==============================
    // SAFARI / iPHONE / iPAD
    // ==============================

    else if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = streamUrl;

        video.addEventListener("loadedmetadata", function () {

            video.play()
                .catch(error => {

                    console.log(
                        "Autoplay bị chặn:",
                        error
                    );

                });

        });

    }

    else {

        errorBox.innerText =
            "Trình duyệt này không hỗ trợ phát HLS.";

        errorBox.style.display = "block";

    }

</script>

</body>
</html>
