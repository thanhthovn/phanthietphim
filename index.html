<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneDrive Video Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container { width: min(1200px, 100%); }
    h1 { font-size: 24px; margin: 0 0 15px; }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .status {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }
    .open {
      display: none;
      margin-top: 12px;
      padding: 10px 15px;
      background: #1677ff;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video OneDrive</h1>

    <div class="player">
      <iframe id="videoFrame"
              title="OneDrive Video"
              allow="autoplay; fullscreen; picture-in-picture"
              allowfullscreen>
      </iframe>
    </div>

    <div id="status" class="status">Đang đọc link video...</div>

    <a id="openLink" class="open" target="_blank" rel="noopener noreferrer">
      Mở video OneDrive
    </a>
  </div>

  <script>
    fetch("video-link.txt")
      .then(response => {
        if (!response.ok) throw new Error("Không đọc được video-link.txt");
        return response.text();
      })
      .then(link => {
        link = link.trim();

        if (!link) {
          throw new Error("video-link.txt đang trống");
        }

        document.getElementById("videoFrame").src = link;
        document.getElementById("openLink").href = link;
        document.getElementById("openLink").style.display = "inline-block";
        document.getElementById("status").textContent = "Đã tải link video.";
      })
      .catch(error => {
        document.getElementById("status").textContent =
          "Không thể đọc link. Nếu mở HTML bằng double-click, hãy chạy website qua web server/hosting.";
        console.error(error);
      });
  </script>
</body>
</html>
